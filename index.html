<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CALZADOCLICK — Estilo y elegancia</title>
  <style>
    :root {
      --bg: #09070d;
      --surface: #120e1a;
      --card: #181324;
      --card-hover: #201930;
      --text: #f5f3ff;
      --muted: #b4acc9;
      --purple: #9333ea;
      --purple-bright: #a855f7;
      --purple-soft: rgba(168, 85, 247, 0.16);
      --border: #2e2444;
      --wa: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1b112e 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 84px;
      min-height: 100vh;
    }

    .top-banner {
      background: linear-gradient(90deg, #6b21a8, var(--purple), #6b21a8);
      color: #fff;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 12px;
      letter-spacing: 0.3px;
    }

    header {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .brand h1 {
      font-size: 1.25rem;
      letter-spacing: 0.6px;
    }

    .brand span {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .cart-btn {
      background: var(--purple);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .cart-btn:hover {
      background: var(--purple-bright);
    }

    .hero {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px 18px;
      text-align: center;
    }

    .hero h2 {
      font-size: 1.9rem;
      margin-bottom: 8px;
    }

    .hero p {
      color: var(--muted);
      max-width: 600px;
      margin: 0 auto;
      font-size: 0.96rem;
    }

    .filters-wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px 20px 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .filter-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: var(--purple-bright);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--purple);
      border-color: var(--purple-bright);
      color: #fff;
    }

    .grid {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, background 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      background: var(--card-hover);
    }

    .card-img-wrap {
      position: relative;
      width: 100%;
      height: 220px;
      background: #100c18;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .promo-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--purple);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--purple-bright);
    }

    .no-img-placeholder {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 16px;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .card-brand {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--purple-bright);
      font-weight: 700;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }

    .card-title:hover {
      color: var(--purple-bright);
    }

    .card-price {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
    }

    .sizes-label {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .sizes-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .size-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .size-chip.selected {
      background: var(--purple-soft);
      border-color: var(--purple-bright);
      color: #fff;
      font-weight: 700;
    }

    .add-btn {
      margin-top: auto;
      background: var(--purple);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-btn:hover {
      background: var(--purple-bright);
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .detail-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1050;
      overflow-y: auto;
    }

    .detail-backdrop.open {
      display: flex;
    }

    .detail-modal {
      position: relative;
      width: 100%;
      max-width: 820px;
      max-height: 92vh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 700px) {
      .detail-modal {
        grid-template-columns: 1fr;
      }
    }

    .detail-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      z-index: 5;
    }

    .zoom-box {
      position: relative;
      width: 100%;
      height: 320px;
      background: #100c18;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: zoom-in;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .zoom-box.zoomed {
      cursor: zoom-out;
    }

    .zoom-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.15s ease-out;
      transform-origin: center center;
    }

    .zoom-note {
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 6px;
      text-align: center;
    }

    .thumbs-bar {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .thumb-item {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--border);
      background: var(--card);
      cursor: pointer;
      padding: 0;
    }

    .thumb-item.active {
      border-color: var(--purple-bright);
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .detail-name {
      font-size: 1.35rem;
      font-weight: 800;
    }

    .detail-text {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .detail-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.84rem;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .detail-box span {
      color: var(--muted);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: flex-end;
      z-index: 1000;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .drawer {
      width: 100%;
      max-width: 390px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      height: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .drawer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .close-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    #cart-items {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cart-item {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
    }

    .remove-btn {
      background: transparent;
      border: none;
      color: #f87171;
      cursor: pointer;
      font-weight: 700;
    }

    .summary-box {
      border-top: 1px solid var(--border);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .checkout-btn {
      background: var(--wa);
      color: #06210f;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .wa-float {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: var(--wa);
      color: #06210f;
      text-decoration: none;
      font-weight: 800;
      padding: 12px 18px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      z-index: 900;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="top-banner">
    Envíos gratis a todo Colombia • Pagos con Nequi, DaviPlata, Bre-B y PSE
  </div>

  <header>
    <div class="brand">
      <img src="logo.jpeg" alt="Logo CalzadoClick" onerror="this.style.display='none'" />
      <div>
        <h1>CALZADOCLICK</h1>
        <span>Estilo y elegancia en cada paso</span>
      </div>
    </div>
    <button type="button" class="cart-btn" onclick="toggleCart(true)">
      Carrito (<span id="cart-count">0</span>)
    </button>
  </header>

  <section class="hero">
    <h2>Catálogo de Zapatillas</h2>
    <p>Elige tu marca favorita, selecciona tu talla y haz tu pedido directo por WhatsApp.</p>
  </section>

  <div class="filters-wrap" id="filters">
    <button type="button" class="filter-btn active" onclick="setBrandFilter('Todas', this)">Todas</button>
    <button type="button" class="filter-btn" onclick="setBrandFilter('PROMOCIONES', this)">PROMOCIONES</button>
    <button type="button" class="filter-btn" onclick="setBrandFilter('Nike', this)">Nike</button>
    <button type="button" class="filter-btn" onclick="setBrandFilter('Jordan', this)">Jordan</button>
    <button type="button" class="filter-btn" onclick="setBrandFilter('Adidas', this)">Adidas</button>
    <button type="button" class="filter-btn" onclick="setBrandFilter('Puma', this)">Puma</button>
    <button type="button" class="filter-btn" onclick="setBrandFilter('Reebok', this)">Reebok</button>
  </div>

  <main class="grid" id="catalog"></main>

  <div class="detail-backdrop" id="detail-modal" onclick="if(event.target === this) closeDetailModal()">
    <div class="detail-modal" id="detail-content"></div>
  </div>

  <div class="modal-backdrop" id="cart-modal" onclick="if(event.target === this) toggleCart(false)">
    <aside class="drawer">
      <div class="drawer-top">
        <h2>Tu Pedido</h2>
        <button type="button" class="close-btn" onclick="toggleCart(false)">X</button>
      </div>
      <div id="cart-items"></div>
      <div class="summary-box">
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="cart-subtotal">$0</span>
        </div>
        <button type="button" class="checkout-btn" onclick="sendWhatsAppOrder()">
          Pedir por WhatsApp
        </button>
      </div>
    </aside>
  </div>

  <a
    class="wa-float"
    href="https://wa.me/573206466252?text=Hola%20CalzadoClick%2C%20tengo%20una%20consulta%20sobre%20las%20zapatillas%20y%20los%20env%C3%ADos"
    target="_blank"
    rel="noopener"
  >
    WhatsApp • 320 646 6252
  </a>

  <script>
    const WHATSAPP_NUMBER = "573206466252";

    const PRODUCTS = [
      {
        id: 1,
        brand: "Nike",
        promo: false,
        name: "Nike Dunk Low Celeste",
        price: 159900,
        sizes: ["36", "37", "38", "39"],
        image: "nikedunklowceleste36al39.jpeg",
        images: ["nikedunklowceleste36al39.jpeg"],
        description: "Zapatilla urbana de corte bajo en tono celeste y blanco, ideal para uso diario y combinaciones casuales.",
        specs: "Confección de corte bajo, costuras reforzadas, plantilla acolchada y suela de tracción firme.",
        materials: "Capellada en cuero sintético, forro interno textil y suela de caucho."
      },
      {
        id: 2,
        brand: "Jordan",
        promo: false,
        name: "Retro Court Negra",
        price: 185000,
        sizes: ["38", "39", "40", "41", "42", "43"],
        image: "",
        images: [],
        description: "Modelo estilo retro en tono negro con diseño versátil para el día a día.",
        specs: "Estructura firme, lengüeta acolchada y suela con buen agarre.",
        materials: "Material sintético, interior textil y suela de goma."
      },
      {
        id: 3,
        brand: "Nike",
        promo: false,
        name: "Nike Skeleton",
        price: 159900,
        sizes: ["40", "41", "42", "43", "44"],
        image: "1nikeskeleton40al44.jpg",
        images: [
          "1nikeskeleton40al44.jpg",
          "2nikeskeleton40al44.jpg",
          "3nikeskeleton40al44.jpg"
        ],
        description: "Zapatilla urbana en tono negro con detalle lateral estilo esqueleto, ideal para uso diario.",
        specs: "Confección de corte bajo, plantilla cómoda y suela con tracción firme.",
        materials: "Capellada sintética y textil, forro interno suave y suela resistente."
      }
    ];

    let selectedBrand = "Todas";
    let selectedSizes = {};
    let cart = [];
    let touchZoomActive = false;

    function formatCOP(value) {
      return "$" + Number(value).toLocaleString("es-CO");
    }

    function getProductPhotos(product) {
      if (Array.isArray(product.images) && product.images.length > 0) {
        return product.images.filter(Boolean);
      }
      return product.image ? [product.image] : [];
    }

    function setBrandFilter(brand, btnEl) {
      selectedBrand = brand;
      const allBtns = document.querySelectorAll(".filter-btn");
      for (let i = 0; i < allBtns.length; i++) {
        allBtns[i].classList.remove("active");
      }
      if (btnEl) {
        btnEl.classList.add("active");
      }
      renderCatalog();
    }

    function selectSize(productId, size) {
      selectedSizes[productId] = size;
      renderCatalog();
    }

    function renderCatalog() {
      const catalog = document.getElementById("catalog");
      if (!catalog) return;

      const filtered = PRODUCTS.filter(p => {
        if (selectedBrand === "Todas") return true;
        if (selectedBrand === "PROMOCIONES") return Boolean(p.promo);
        return String(p.brand).toLowerCase() === String(selectedBrand).toLowerCase();
      });

      if (filtered.length === 0) {
        catalog.innerHTML = `<div class="empty-msg">Aún no hay modelos cargados en <strong>${selectedBrand}</strong>.</div>`;
        return;
      }

      catalog.innerHTML = filtered.map(product => {
        const currentSize = selectedSizes[product.id] || product.sizes[0];
        const photos = getProductPhotos(product);
        const firstPhoto = photos[0] || "";

        const imageHTML = firstPhoto
          ? `<img src="${firstPhoto}" alt="${product.name}" onerror="this.style.display='none'" />`
          : `<div class="no-img-placeholder">Foto próximamente</div>`;

        const promoBadge = product.promo ? `<span class="promo-tag">PROMO</span>` : "";

        const sizesHTML = product.sizes.map(size => `
          <button
            type="button"
            class="size-chip ${currentSize === size ? "selected" : ""}"
            onclick="selectSize(${product.id}, '${size}')"
          >${size}</button>
        `).join("");

        return `
          <article class="card">
            <div class="card-img-wrap" onclick="openDetailModal(${product.id})">
              ${promoBadge}
              ${imageHTML}
            </div>
            <div class="card-body">
              <div class="card-brand">${product.brand}</div>
              <div class="card-title" onclick="openDetailModal(${product.id})">${product.name}</div>
              <div class="card-price">${formatCOP(product.price)}</div>
              <div class="sizes-label">Talla seleccionada: <strong>${currentSize}</strong></div>
              <div class="sizes-list">${sizesHTML}</div>
              <button type="button" class="add-btn" onclick="addToCart(${product.id})">
                Agregar al carrito
              </button>
            </div>
          </article>
        `;
      }).join("");
    }

    function openDetailModal(productId) {
      const product = PRODUCTS.find(p => p.id === productId);
      if (!product) return;

      touchZoomActive = false;
      const currentSize = selectedSizes[product.id] || product.sizes[0];
      const photos = getProductPhotos(product);

      const mainImgHTML = photos.length > 0
        ? `<img id="detail-zoom-img" src="${photos[0]}" alt="${product.name}" onerror="this.style.display='none'" />`
        : `<div class="no-img-placeholder">Foto próximamente</div>`;

      const thumbsHTML = photos.length > 1
        ? `<div class="thumbs-bar">
            ${photos.map((src, idx) => `
              <button type="button" class="thumb-item ${idx === 0 ? "active" : ""}" onclick="switchDetailPhoto('${src}', this)">
                <img src="${src}" alt="Foto ${idx + 1}" onerror="this.parentElement.style.display='none'" />
              </button>
            `).join("")}
          </div>`
        : "";

      const sizesHTML = product.sizes.map(size => `
        <button
          type="button"
          class="size-chip ${currentSize === size ? "selected" : ""}"
          onclick="selectSize(${product.id}, '${size}'); openDetailModal(${product.id});"
        >${size}</button>
      `).join("");

      const content = document.getElementById("detail-content");
      content.innerHTML = `
        <button type="button" class="detail-close" onclick="closeDetailModal()">X</button>
        <div>
          <div
            class="zoom-box"
            id="zoom-box"
            onmousemove="moveZoom(event)"
            onmouseleave="leaveZoom()"
            onclick="toggleTouchZoom(event)"
          >
            ${mainImgHTML}
          </div>
          ${photos.length > 0 ? `<div class="zoom-note">Pasa el cursor (o toca la foto) para hacer zoom</div>` : ""}
          ${thumbsHTML}
        </div>
        <div class="detail-col">
          <div class="card-brand">${product.brand}${product.promo ? " • PROMOCIÓN" : ""}</div>
          <div class="detail-name">${product.name}</div>
          <div class="card-price">${formatCOP(product.price)}</div>
          <p class="detail-text">${product.description || ""}</p>
          <div class="detail-box">
            <div><strong>Cómo está hecho:</strong> <span>${product.specs || ""}</span></div>
            <div><strong>Materiales:</strong> <span>${product.materials || ""}</span></div>
          </div>
          <div class="sizes-label">Talla seleccionada: <strong>${currentSize}</strong></div>
          <div class="sizes-list">${sizesHTML}</div>
          <button type="button" class="add-btn" onclick="addToCart(${product.id}); closeDetailModal();">
            Agregar al carrito
          </button>
        </div>
      `;

      document.getElementById("detail-modal").classList.add("open");
    }

    function closeDetailModal() {
      document.getElementById("detail-modal").classList.remove("open");
    }

    function switchDetailPhoto(src, btn) {
      const img = document.getElementById("detail-zoom-img");
      if (img) {
        img.style.display = "";
        img.src = src;
        img.style.transform = "scale(1)";
        img.style.transformOrigin = "center center";
      }
      touchZoomActive = false;
      const box = document.getElementById("zoom-box");
      if (box) box.classList.remove("zoomed");
      const thumbs = document.querySelectorAll(".thumb-item");
      for (let i = 0; i < thumbs.length; i++) {
        thumbs[i].classList.remove("active");
      }
      if (btn) btn.classList.add("active");
    }

    function applyZoomAt(clientX, clientY, scaleVal) {
      const box = document.getElementById("zoom-box");
      const img = document.getElementById("detail-zoom-img");
      if (!box || !img) return;
      const rect = box.getBoundingClientRect();
      const x = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
      const y = Math.max(0, Math.min(100, ((clientY - rect.top) / rect.height) * 100));
      img.style.transformOrigin = `${x}% ${y}%`;
      img.style.transform = `scale(${scaleVal})`;
    }

    function moveZoom(e) {
      applyZoomAt(e.clientX, e.clientY, 2);
    }

    function leaveZoom() {
      if (touchZoomActive) return;
      const img = document.getElementById("detail-zoom-img");
      if (!img) return;
      img.style.transform = "scale(1)";
      img.style.transformOrigin = "center center";
    }

    function toggleTouchZoom(e) {
      const box = document.getElementById("zoom-box");
      const img = document.getElementById("detail-zoom-img");
      if (!box || !img) return;
      touchZoomActive = !touchZoomActive;
      if (touchZoomActive) {
        box.classList.add("zoomed");
        applyZoomAt(e.clientX, e.clientY, 2);
      } else {
        box.classList.remove("zoomed");
        img.style.transform = "scale(1)";
        img.style.transformOrigin = "center center";
      }
    }

    function addToCart(productId) {
      const product = PRODUCTS.find(p => p.id === productId);
      if (!product) return;
      const size = selectedSizes[productId] || product.sizes[0];
      cart.push({
        id: product.id,
        name: product.name,
        price: product.price,
        size: size
      });
      updateCartUI();
      toggleCart(true);
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function updateCartUI() {
      const countEl = document.getElementById("cart-count");
      const itemsEl = document.getElementById("cart-items");
      const subtotalEl = document.getElementById("cart-subtotal");

      countEl.textContent = cart.length;

      if (cart.length === 0) {
        itemsEl.innerHTML = `<p style="color: var(--muted); font-size: 0.9rem;">Tu carrito está vacío.</p>`;
        subtotalEl.textContent = "$0";
        return;
      }

      let total = 0;
      itemsEl.innerHTML = cart.map((item, idx) => {
        total += item.price;
        return `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong><br />
              <span style="color: var(--muted);">Talla ${item.size} • ${formatCOP(item.price)}</span>
            </div>
            <button type="button" class="remove-btn" onclick="removeFromCart(${idx})">Quitar</button>
          </div>
        `;
      }).join("");

      subtotalEl.textContent = formatCOP(total);
    }

    function toggleCart(open) {
      const modal = document.getElementById("cart-modal");
      if (open) {
        modal.classList.add("open");
      } else {
        modal.classList.remove("open");
      }
    }

    function sendWhatsAppOrder() {
      if (cart.length === 0) {
        alert("Agrega al menos una zapatilla al carrito.");
        return;
      }
      let total = 0;
      const lines = cart.map((item, i) => {
        total += item.price;
        return `${i + 1}. ${item.name} (Talla ${item.size}) - ${formatCOP(item.price)}`;
      });

      const message =
        `Hola CalzadoClick, quiero hacer este pedido:\n\n` +
        lines.join("\n") +
        `\n\nTotal: ${formatCOP(total)}`;

      const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
      window.open(url, "_blank");
    }

    updateCartUI();
    renderCatalog();
  </script>
</body>
</html>

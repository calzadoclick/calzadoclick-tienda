<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CALZADOCLICK — Estilo y elegancia</title>
  <style>
    :root {
      --bg: #09070d;
      --surface: #120e1a;
      --card: #181324;
      --card-hover: #201930;
      --text: #f5f3ff;
      --muted: #b4acc9;
      --purple: #9333ea;
      --purple-bright: #a855f7;
      --purple-soft: rgba(168, 85, 247, 0.16);
      --border: #2e2444;
      --wa: #25d366;
      --promo: #f59e0b;
      --promo-soft: rgba(245, 158, 11, 0.16);
      --success: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1b112e 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 84px;
      min-height: 100vh;
    }

    .top-banner {
      background: linear-gradient(90deg, #6b21a8, var(--purple), #6b21a8);
      color: #fff;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 12px;
      letter-spacing: 0.3px;
    }

    header {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .brand h1 {
      font-size: 1.25rem;
      letter-spacing: 0.6px;
    }

    .brand span {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .cart-btn {
      background: var(--purple);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .cart-btn:hover {
      background: var(--purple-bright);
    }

    .hero {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px 14px;
      text-align: center;
    }

    .hero h2 {
      font-size: 1.9rem;
      margin-bottom: 8px;
    }

    .hero p {
      color: var(--muted);
      max-width: 640px;
      margin: 0 auto 12px;
      font-size: 0.96rem;
    }

    .benefits-line {
      color: #e9d5ff;
      font-size: 0.86rem;
      font-weight: 600;
    }

    .benefits-line span {
      color: var(--success);
    }

    .filters-wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px 20px 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;

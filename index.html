<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CALZADOCLICK — Estilo, comodidad y envíos gratis a toda Colombia</title>
  <style>
    :root {
      --bg: #09070d;
      --surface: #120e1a;
      --card: #181324;
      --card-hover: #201930;
      --text: #f5f3ff;
      --muted: #b4acc9;
      --purple: #9333ea;
      --purple-bright: #a855f7;
      --purple-soft: rgba(168, 85, 247, 0.16);
      --border: #2e2444;
      --wa: #25d366;
      --promo: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1b112e 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 96px;
      min-height: 100vh;
    }

    .top-banner {
      background: linear-gradient(90deg, #6b21a8, var(--purple), #6b21a8);
      color: #fff;
      text-align: center;
      font-size: 0.86rem;
      font-weight: 700;
      padding: 9px 12px;
      letter-spacing: 0.3px;
    }

    header {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .brand h1 {
      font-size: 1.25rem;
      letter-spacing: 0.6px;
    }

    .brand span {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .cart-btn {
      background: var(--purple);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .cart-btn:hover {
      background: var(--purple-bright);
    }

    .hero {
      max-width: 1180px;
      margin: 0 auto;
      padding: 30px 20px 14px;
      text-align: center;
    }

    .hero h2 {
      font-size: 1.95rem;
      margin-bottom: 8px;
    }

    .hero p {
      color: var(--muted);
      max-width: 660px;
      margin: 0 auto;
      font-size: 0.96rem;
    }

    .trust-bar {
      max-width: 1180px;
      margin: 14px auto 6px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .trust-item {
      background: rgba(24, 19, 36, 0.88);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 0.82rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .trust-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--purple-bright);
      flex-shrink: 0;
    }

    .trust-item strong {
      display: block;
      font-size: 0.85rem;
      color: #fff;
    }

    .trust-item span {
      color: var(--muted);
      font-size: 0.77rem;
    }

    .controls-wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .search-input {
      width: 100%;
      max-width: 450px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--purple-bright);
    }

    .filters-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .filter-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: var(--purple-bright);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--purple);
      border-color: var(--purple-bright);
      color: #fff;
    }

    .filter-btn.promo-btn {
      border-color: rgba(244, 63, 94, 0.55);
      color: #fda4af;
    }

    .filter-btn.promo-btn.active,
    .filter-btn.promo-btn:hover {
      background: var(--promo);
      border-color: var(--promo);
      color: #fff;
    }

    .grid {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, background 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      background: var(--card-hover);
      border-color: var(--purple-bright);
    }

    .card-img-wrap {
      position: relative;
      width: 100%;
      height: 230px;
      background: #100c18;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .card:hover .card-img-wrap img {
      transform: scale(1.06);
    }

    .badge-promo {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--promo);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.4px;
      z-index: 2;
    }

    .badge-zoom {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(9, 7, 13, 0.84);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      z-index: 2;
    }

    .no-img-placeholder {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 16px;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex: 1;
    }

    .card-brand {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--purple-bright);
      font-weight: 700;
    }

    .card-title {
      font-size: 1.06rem;
      font-weight: 700;
      cursor: pointer;
    }

    .card-title:hover {
      color: var(--purple-bright);
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .card-price {
      font-size: 1.18rem;
      font-weight: 800;
      color: #fff;
    }

    .card-old-price {
      font-size: 0.86rem;
      color: var(--muted);
      text-decoration: line-through;
    }

    .sizes-label {
      font-size: 0.79rem;
      color: var(--muted);
    }

    .sizes-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .size-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .size-chip.selected {
      background: var(--purple-soft);
      border-color: var(--purple-bright);
      color: #fff;
      font-weight: 700;
    }

    .card-actions {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 6px;
    }

    .detail-btn {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .detail-btn:hover {
      border-color: var(--purple-bright);
    }

    .add-btn {
      background: var(--purple);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-btn:hover {
      background: var(--purple-bright);
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .faq-section {
      max-width: 900px;
      margin: 48px auto 0;
      padding: 0 20px;
    }

    .faq-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .faq-header h2 {
      font-size: 1.55rem;
      margin-bottom: 6px;
    }

    .faq-header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .faq-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .faq-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .faq-question {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 15px 18px;
      text-align: left;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .faq-question:hover {
      color: var(--purple-bright);
    }

    .faq-icon {
      color: var(--purple-bright);
      font-size: 1.15rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .faq-answer {
      display: none;
      padding: 12px 18px 16px;
      color: var(--muted);
      font-size: 0.89rem;
      border-top: 1px solid rgba(46, 36, 68, 0.55);
    }

    .faq-item.open .faq-answer {
      display: block;
    }

    .product-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1100;
      overflow-y: auto;
    }

    .product-modal-backdrop.

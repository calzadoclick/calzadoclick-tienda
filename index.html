<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CALZADOCLICK — Estilo y elegancia</title>
  <style>
    :root {
      --bg: #09070d;
      --surface: #120e1a;
      --card: #181324;
      --card-hover: #201930;
      --text: #f5f3ff;
      --muted: #b4acc9;
      --purple: #9333ea;
      --purple-bright: #a855f7;
      --purple-soft: rgba(168, 85, 247, 0.16);
      --border: #2e2444;
      --wa: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1b112e 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 84px;
      min-height: 100vh;
    }

    .top-banner {
      background: linear-gradient(90deg, #6b21a8, var(--purple), #6b21a8);
      color: #fff;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 12px;
      letter-spacing: 0.3px;
    }

    header {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .brand h1 {
      font-size: 1.25rem;
      letter-spacing: 0.6px;
    }

    .brand span {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .cart-btn {
      background: var(--purple);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .cart-btn:hover {
      background: var(--purple-bright);
    }

    .hero {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px 18px;
      text-align: center;
    }

    .hero h2 {
      font-size: 1.9rem;
      margin-bottom: 8px;
    }

    .hero p {
      color: var(--muted);
      max-width: 600px;
      margin: 0 auto;
      font-size: 0.96rem;
    }

    .filters-wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px 20px 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .filter-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: var(--purple-bright);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--purple);
      border-color: var(--purple-bright);
      color: #fff;
    }

    .grid {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, background 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      background: var(--card-hover);
    }

    .card-img-wrap {
      width: 100%;
      height: 220px;
      background: #100c18;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .no-img-placeholder {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 16px;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .card-brand {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--purple-bright);
      font-weight: 700;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .card-price {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
    }

    .sizes-label {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .sizes-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .size-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .size-chip.selected {
      background: var(--purple-soft);
      border-color: var(--purple-bright);
      color: #fff;
      font-weight: 700;
    }

    .add-btn {
      margin-top: auto;
      background: var(--purple);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-btn:hover {
      background: var(--purple-bright);
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    /* Carrito modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: flex-end;
      z-index: 1000;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .drawer {
      width: 100%;
      max-width: 390px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      height: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .drawer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .close-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    #cart-items {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cart-item {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
    }

    .remove-btn {
      background: transparent;
      border: none;
      color: #f87171;
      cursor: pointer;
      font-weight: 700;
    }

    .summary-box {
      border-top: 1px solid var(--border);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .checkout-btn {
      background: var(--wa);
      color: #06210f;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.95rem;
    }

    /* Botón flotante WhatsApp */
    .wa-float {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: var(--wa);
      color: #06210f;
      text-decoration: none;
      font-weight: 800;
      padding: 12px 18px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      z-index: 900;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="top-banner">
    Envíos a todo Colombia • Pagos con Nequi, DaviPlata, Bre-B y PSE
  </div>

  <header>
    <div class="brand">
      <img src="logo.jpeg" alt="Logo CalzadoClick" onerror="this.style.display='none'" />
      <div>
        <h1>CALZADOCLICK</h1>
        <span>Estilo y elegancia en cada paso</span>
      </div>
    </div>
    <button class="cart-btn" onclick="toggleCart(true)">
      Carrito (<span id="cart-count">0</span>)
    </button>
  </header>

  <section class="hero">
    <h2>Catálogo de Zapatillas</h2>
    <p>Elige tu marca favorita, selecciona tu talla y haz tu pedido directo por WhatsApp.</p>
  </section>

  <div class="filters-wrap" id="filters">
    <button class="filter-btn active" data-brand="Todas">Todas</button>
    <button class="filter-btn" data-brand="Nike">Nike</button>
    <button class="filter-btn" data-brand="Jordan">Jordan</button>
    <button class="filter-btn" data-brand="Adidas">Adidas</button>
    <button class="filter-btn" data-brand="Puma">Puma</button>
    <button class="filter-btn" data-brand="Reebok">Reebok</button>
  </div>

  <main class="grid" id="catalog"></main>

  <div class="modal-backdrop" id="cart-modal" onclick="if(event.target === this) toggleCart(false)">
    <aside class="drawer">
      <div class="drawer-top">
        <h2>Tu Pedido</h2>
        <button class="close-btn" onclick="toggleCart(false)">X</button>
      </div>
      <div id="cart-items"></div>
      <div class="summary-box">
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="cart-subtotal">$0</span>
        </div>
        <button class="checkout-btn" onclick="sendWhatsAppOrder()">
          Pedir por WhatsApp
        </button>
      </div>
    </aside>
  </div>

  <a
    class="wa-float"
    href="https://wa.me/573206466252?text=Hola%20CalzadoClick%2C%20tengo%20una%20consulta%20sobre%20las%20zapatillas%20y%20los%20env%C3%ADos"
    target="_blank"
    rel="noopener"
  >
    WhatsApp • 320 646 6252
  </a>

  <script>
    const WHATSAPP_NUMBER = "573206466252";

    // Edita brand ("Nike", "Jordan", "Adidas", "Puma", "Reebok"), name, price, sizes e image
    const PRODUCTS = [
      {
        id: 1,
        brand: "Nike",
        name: "Nike Dunk Low Celeste",
        price: 159900,
        sizes: ["36", "37", "38", "39"],
        image: "nikedunklowceleste36al39.jpeg"
      },
      {
        id: 2,
        brand: "Jordan",
        name: "Retro Court Negra",
        price: 185000,
        sizes: ["38", "39", "40", "41", "42", "43"],
        image: ""
      }
    ];

    let selectedBrand = "Todas";
    let selectedSizes = {};
    let cart = [];

    function formatCOP(value) {
      return "$" + Number(value).toLocaleString("es-CO");
    }

    function selectSize(productId, size) {
      selectedSizes[productId] = size;
      renderCatalog();
    }

    function renderCatalog() {
      const catalog = document.getElementById("catalog");
      const filtered = selectedBrand === "Todas"
        ? PRODUCTS
        : PRODUCTS.filter(p => p.brand.toLowerCase() === selectedBrand.toLowerCase());

      if (filtered.length === 0) {
        catalog.innerHTML = `<div class="empty-msg">Aún no hay modelos cargados en la marca <strong>${selectedBrand}</strong>.</div>`;
        return;
      }

      catalog.innerHTML = filtered.map(product => {
        const currentSize = selectedSizes[product.id] || product.sizes[0];
        const imageHTML = product.image
          ? `<img src="${product.image}" alt="${product.name}" onerror="this.parentElement.innerHTML='<div class=\\'no-img-placeholder\\'>Foto no disponible (${product.image})</div>'" />`
          : `<div class="no-img-placeholder">Foto próximamente</div>`;

        const sizesHTML = product.sizes.map(size => `
          <button
            type="button"
            class="size-chip ${currentSize === size ? "selected" : ""}"
            onclick="selectSize(${product.id}, '${size}')"
          >${size}</button>
        `).join("");

        return `
          <article class="card">
            <div class="card-img-wrap">
              ${imageHTML}
            </div>
            <div class="card-body">
              <div class="card-brand">${product.brand}</div>
              <div class="card-title">${product.name}</div>
              <div class="card-price">${formatCOP(product.price)}</div>
              <div class="sizes-label">Talla seleccionada: <strong>${currentSize}</strong></div>
              <div class="sizes-list">${sizesHTML}</div>
              <button type="button" class="add-btn" onclick="addToCart(${product.id})">
                Agregar al carrito
              </button>
            </div>
          </article>
        `;
      }).join("");
    }

    function setupFilters() {
      const buttons = document.querySelectorAll(".filter-btn");
      buttons.forEach(btn => {
        btn.addEventListener("click", () => {
          buttons.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          selectedBrand = btn.getAttribute("data-brand");
          renderCatalog();
        });
      });
    }

    function addToCart(productId) {
      const product = PRODUCTS.find(p => p.id === productId);
      if (!product) return;
      const size = selectedSizes[productId] || product.sizes[0];
      cart.push({
        id: product.id,
        name: product.name,
        price: product.price,
        size: size
      });
      updateCartUI();
      toggleCart(true);
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function updateCartUI() {
      const countEl = document.getElementById("cart-count");
      const itemsEl = document.getElementById("cart-items");
      const subtotalEl = document.getElementById("cart-subtotal");

      countEl.textContent = cart.length;

      if (cart.length === 0) {
        itemsEl.innerHTML = `<p style="color: var(--muted); font-size: 0.9rem;">Tu carrito está vacío.</p>`;
        subtotalEl.textContent = "$0";
        return;
      }

      let total = 0;
      itemsEl.innerHTML = cart.map((item, idx) => {
        total += item.price;
        return `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong><br />
              <span style="color: var(--muted);">Talla ${item.size} • ${formatCOP(item.price)}</span>
            </div>
            <button class="remove-btn" onclick="removeFromCart(${idx})">Quitar</button>
          </div>
        `;
      }).join("");

      subtotalEl.textContent = formatCOP(total);
    }

    function toggleCart(open) {
      const modal = document.getElementById("cart-modal");
      if (open) {
        modal.classList.add("open");
      } else {
        modal.classList.remove("open");
      }
    }

    function sendWhatsAppOrder() {
      if (cart.length === 0) {
        alert("Agrega al menos una zapatilla al carrito.");
        return;
      }
      let total = 0;
      const lines = cart.map((item, i) => {
        total += item.price;
        return `${i + 1}. ${item.name} (Talla ${item.size}) - ${formatCOP(item.price)}`;
      });

      const message =
        `Hola CalzadoClick, quiero hacer este pedido:\n\n` +
        lines.join("\n") +
        `\n\nTotal: ${formatCOP(total)}`;

      const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
      window.open(url, "_blank");
    }

    setupFilters();
    updateCartUI();
    renderCatalog();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CALZADOCLICK — Estilo, comodidad y envíos gratis a toda Colombia</title>
  <style>
    :root {
      --bg: #09070d;
      --surface: #120e1a;
      --card: #181324;
      --card-hover: #201930;
      --text: #f5f3ff;
      --muted: #b4acc9;
      --purple: #9333ea;
      --purple-bright: #a855f7;
      --purple-soft: rgba(168, 85, 247, 0.16);
      --border: #2e2444;
      --wa: #25d366;
      --promo: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1b112e 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 96px;
      min-height: 100vh;
    }

    .top-banner {
      background: linear-gradient(90deg, #6b21a8, var(--purple), #6b21a8);
      color: #fff;
      text-align: center;
      font-size: 0.86rem;
      font-weight: 700;
      padding: 9px 12px;
      letter-spacing: 0.3px;
    }

    header {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .brand h1 {
      font-size: 1.25rem;
      letter-spacing: 0.6px;
    }

    .brand span {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .cart-btn {
      background: var(--purple);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .cart-btn:hover {
      background: var(--purple-bright);
    }

    .hero {
      max-width: 1180px;
      margin: 0 auto;
      padding: 30px 20px 14px;
      text-align: center;
    }

    .hero h2 {
      font-size: 1.95rem;
      margin-bottom: 8px;
    }

    .hero p {
      color: var(--muted);
      max-width: 660px;
      margin: 0 auto;
      font-size: 0.96rem;
    }

    /* Barra de confianza */
    .trust-bar {
      max-width: 1180px;
      margin: 14px auto 6px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .trust-item {
      background: rgba(24, 19, 36, 0.88);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 0.82rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .trust-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--purple-bright);
      flex-shrink: 0;
    }

    .trust-item strong {
      display: block;
      font-size: 0.85rem;
      color: #fff;
    }

    .trust-item span {
      color: var(--muted);
      font-size: 0.77rem;
    }

    /* Buscador y filtros */
    .controls-wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .search-input {
      width: 100%;
      max-width: 450px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--purple-bright);
    }

    .filters-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .filter-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: var(--purple-bright);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--purple);
      border-color: var(--purple-bright);
      color: #fff;
    }

    .filter-btn.promo-btn {
      border-color: rgba(244, 63, 94, 0.55);
      color: #fda4af;
    }

    .filter-btn.promo-btn.active,
    .filter-btn.promo-btn:hover {
      background: var(--promo);
      border-color: var(--promo);
      color: #fff;
    }

    /* Grid de catálogo */
    .grid {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, background 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      background: var(--card-hover);
      border-color: var(--purple-bright);
    }

    .card-img-wrap {
      position: relative;
      width: 100%;
      height: 230px;
      background: #100c18;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .card:hover .card-img-wrap img {
      transform: scale(1.06);
    }

    .badge-promo {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--promo);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
